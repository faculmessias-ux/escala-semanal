<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Converter Escala Semanal em PWA</title><style>body{font:16px system-ui;margin:3rem auto;max-width:600px;padding:0 1rem;background:#f1f4f0;color:#16201a}main{background:white;border:1px solid #cad7cc;border-radius:16px;padding:28px}h1{font-size:24px}input{display:block;margin:18px 0}button{background:#2b7a3d;color:white;border:0;border-radius:8px;padding:14px;cursor:pointer}p{line-height:1.55}</style></head><body><main><h1>Escala Semanal — Converter para PWA</h1><p>Escolha o arquivo HTML original. A conversão é feita inteiramente neste navegador, sem enviar dados para servidores.</p><input id="file" type="file" accept=".html,text/html"><button id="go">Gerar index.html</button><p id="msg"></p></main><script>document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0],m=document.getElementById('msg');if(!f){m.textContent='Selecione seu HTML original.';return}let s=await f.text();s=s.replace(/\(function setupPWA\(\) \{[\s\S]*?\}\)\(\);/,'');if(!s.includes('href="./manifest.webmanifest"'))s=s.replace('</head>','<link rel="manifest" href="./manifest.webmanifest">\n<link rel="icon" href="./icons/icon-192.png">\n<link rel="apple-touch-icon" href="./icons/icon-192.png">\n</head>');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/html;charset=utf-8'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);m.textContent='index.html gerado! Envie-o junto dos arquivos manifest.webmanifest, sw.js e icons/ ao GitHub.'};</script></body></html>
